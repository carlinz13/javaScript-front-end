
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Produtos</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Catálogo de Produtos</h1>

    <input
        type="text"
        id="busca"
        placeholder="Pesquisar produto..."
    >

    <div id="container"></div>

    <script> 
        

  
campoPesquisa = document.getElementById("busca");
let areaProdutos = document.getElementById("container");


let catalogoItens = [
    "POCO X8",
    "ASUS TUF",
    "POCO X5",
    "Samsung",
    "iPhone",
    "Notebook Dell"
];


function desenharCatalogo(itensExibidos) {

    areaProdutos.innerHTML = "";

    itensExibidos.forEach(function(nomeItem) {

        let novoCartao = document.createElement("div");

        novoCartao.className = "card";

        novoCartao.innerText = nomeItem;

        areaProdutos.appendChild(novoCartao);

    });
}

desenharCatalogo(catalogoItens);


campoPesquisa.addEventListener("input", function() {

    let textoDigitado = campoPesquisa.value.toLowerCase();

    let resultado = catalogoItens.filter(function(produto) {

        return produto.toLowerCase().includes(textoDigitado);

    });

    desenharCatalogo(resultado);

});

    </script>

</body>
</html>
